sonar.projectKey=cohort-10-dotnet-21515-laiba
sonar.projectName=Task Management Tool

# Source roots
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src

# Exclusions (generated / non-production code)
sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/node_modules/**,**/dist/**,**/*.g.cs,**/*.g.i.cs
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,frontend/src/**/*.test.*,frontend/src/**/*.spec.*

# Coverage report paths
sonar.cs.opencover.reportsPaths=backend/tests/**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
